<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atendente — Pizzaria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
<style>
  body {
    padding: 20px;
    max-width: 1400px;
    margin: 0 auto;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 14px;
    border-bottom: 2px solid var(--primaria);
    margin-bottom: 20px;
  }
  header h1 {
    font-size: 20px;
    color: var(--primaria);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--primaria);
    color: var(--branco);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
    font-size: 13px;
  }
  header nav { display: flex; gap: 16px; }
  header nav a {
    color: var(--cinza-500);
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
  }
  header nav a:hover { color: var(--acento); }

  /* ========== Layout principal em 3 colunas ========== */
  .layout {
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 20px;
    align-items: start;
  }

  .painel-cardapio {
    background: white;
    border-radius: 12px;
    border: 1px solid var(--cinza-200);
    padding: 18px;
    max-height: calc(100vh - 120px);
    overflow-y: auto;
  }

  .painel-cardapio h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--cinza-500);
    font-weight: 700;
    margin-bottom: 12px;
  }

  .busca-wrap {
    position: relative;
    margin-bottom: 12px;
  }
  .busca-wrap input {
    width: 100%;
    padding: 10px 34px 10px 34px;
    border: 1px solid var(--cinza-300);
    border-radius: 8px;
    font-family: inherit;
    font-size: 14px;
    color: var(--primaria);
    background: var(--cinza-100);
    transition: all 0.15s;
  }
  .busca-wrap input:focus {
    outline: none;
    border-color: var(--acento);
    background: white;
    box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.08);
  }
  .busca-wrap .icone-busca {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cinza-500);
    font-size: 15px;
    pointer-events: none;
  }
  .busca-wrap .limpa-busca {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--cinza-300);
    color: white;
    border: none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: none;
    padding: 0;
  }
  .busca-wrap .limpa-busca:hover { background: var(--cinza-500); }
  .busca-wrap.tem-texto .limpa-busca { display: flex; align-items: center; justify-content: center; }

  .badge-resultado {
    display: inline-block;
    background: var(--acento-claro);
    color: var(--acento-escuro);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    margin-left: 8px;
  }
  .item-card .categoria-hint {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--cinza-500);
    font-weight: 600;
    margin-bottom: 2px;
  }
  mark {
    background: var(--dourado-claro);
    color: var(--primaria);
    padding: 0 2px;
    border-radius: 2px;
    font-weight: 700;
  }

  .categorias-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
    flex-wrap: wrap;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--cinza-200);
  }
  .categorias-tabs button {
    background: var(--cinza-100);
    color: var(--cinza-700);
    padding: 6px 12px;
    border-radius: 20px;
    border: none;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .categorias-tabs button:hover { background: var(--cinza-200); }
  .categorias-tabs button.ativo {
    background: var(--primaria);
    color: var(--branco);
  }

  .grid-itens {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .item-card {
    background: white;
    border: 2px solid var(--cinza-200);
    border-radius: 10px;
    padding: 14px 12px;
    text-align: left;
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    color: var(--primaria);
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .item-card:hover:not(:disabled) {
    border-color: var(--acento);
    transform: translateY(-1px);
  }
  .item-card:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  .item-card .nome {
    font-weight: 700;
    font-size: 14px;
  }
  .item-card .desc {
    font-size: 11px;
    color: var(--cinza-500);
    line-height: 1.3;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .item-card .faixa {
    font-size: 11px;
    font-weight: 600;
    color: var(--verde);
    margin-top: 4px;
  }
  .item-card .esgotado-tag {
    background: var(--cinza-500);
    color: white;
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: inline-block;
    margin-top: 3px;
    width: fit-content;
  }

  /* ========== Carrinho ========== */
  .painel-carrinho {
    background: white;
    border: 1px solid var(--cinza-200);
    border-radius: 12px;
    padding: 18px;
    position: sticky;
    top: 20px;
    max-height: calc(100vh - 120px);
    display: flex;
    flex-direction: column;
  }
  .painel-carrinho h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--cinza-500);
    font-weight: 700;
    margin-bottom: 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .painel-carrinho h2 .qty {
    background: var(--cinza-200);
    color: var(--cinza-700);
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }

  .lista-carrinho {
    flex: 1;
    overflow-y: auto;
    margin-bottom: 12px;
    min-height: 100px;
  }
  .carrinho-vazio {
    text-align: center;
    padding: 30px 10px;
    color: var(--cinza-500);
    font-size: 13px;
  }
  .linha-carrinho {
    padding: 10px 0;
    border-bottom: 1px solid var(--cinza-200);
    cursor: pointer;
  }
  .linha-carrinho:hover { background: var(--cinza-100); margin: 0 -8px; padding: 10px 8px; border-radius: 6px; }
  .linha-carrinho .topo {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 3px;
  }
  .linha-carrinho .nome {
    font-weight: 600;
    color: var(--primaria);
    font-size: 13px;
    line-height: 1.3;
  }
  .linha-carrinho .qty {
    background: var(--primaria);
    color: white;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    min-width: 22px;
    text-align: center;
    align-self: flex-start;
  }
  .linha-carrinho .detalhes {
    font-size: 11px;
    color: var(--cinza-500);
    line-height: 1.4;
  }
  .linha-carrinho .rodape-linha {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 5px;
  }
  .linha-carrinho .preco {
    font-weight: 700;
    color: var(--verde);
    font-size: 13px;
  }
  .linha-carrinho .btn-remover {
    background: transparent;
    border: none;
    color: var(--acento);
    font-size: 16px;
    cursor: pointer;
    padding: 0 4px;
    line-height: 1;
  }

  .total-carrinho {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 0;
    border-top: 2px solid var(--primaria);
    margin-top: 8px;
    font-size: 15px;
    font-weight: 700;
    color: var(--primaria);
  }
  .total-carrinho .valor {
    color: var(--verde);
    font-size: 18px;
    font-weight: 800;
  }

  .btn-confirmar {
    width: 100%;
    padding: 16px;
    background: var(--acento);
    color: white;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    box-shadow: 0 3px 10px rgba(220, 38, 38, 0.3);
    transition: background 0.15s;
    margin-top: 6px;
  }
  .btn-confirmar:hover:not(:disabled) { background: var(--acento-escuro); }
  .btn-confirmar:disabled {
    background: var(--cinza-300);
    color: var(--cinza-500);
    cursor: not-allowed;
    box-shadow: none;
  }

  .btn-limpar {
    width: 100%;
    padding: 8px;
    background: transparent;
    color: var(--cinza-500);
    border: none;
    font-size: 12px;
    margin-top: 4px;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-limpar:hover { color: var(--acento); }

  /* ========== Senhas ativas (embaixo) ========== */
  .secao-senhas {
    margin-top: 24px;
    background: white;
    border: 1px solid var(--cinza-200);
    border-radius: 12px;
    padding: 18px;
  }
  .secao-senhas h2 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--cinza-500);
    font-weight: 700;
    margin-bottom: 12px;
  }
  .grupo-senhas {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .grupo-senhas h3 {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--cinza-500);
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  .cards-senhas {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .card-senha {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: white;
    border: 1px solid var(--cinza-200);
    border-radius: 8px;
    border-left: 4px solid var(--dourado);
  }
  .card-senha.pronto { border-left-color: var(--verde); background: #f0fdf4; }
  .card-senha .num {
    font-size: 20px;
    font-weight: 900;
    color: var(--primaria);
  }
  .card-senha .btns { display: flex; gap: 4px; }
  .card-senha .btn-mini {
    padding: 5px 10px;
    font-size: 11px;
    border-radius: 5px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-mini.verde { background: var(--verde); color: white; }
  .btn-mini.verde:hover { background: var(--verde-escuro); }
  .btn-mini.escuro { background: var(--primaria); color: white; }
  .btn-mini.escuro:hover { background: var(--primaria-clara); }
  .btn-mini.cinza { background: var(--cinza-200); color: var(--cinza-700); }
  .btn-mini.cinza:hover { background: var(--cinza-300); }

  /* ========== Modal item ========== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.6);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-overlay.aberto { display: flex; }
  .modal {
    background: white;
    border-radius: 12px;
    padding: 22px;
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
  }
  .modal h3 {
    font-size: 18px;
    color: var(--primaria);
    margin-bottom: 4px;
  }
  .modal .desc-item {
    font-size: 12px;
    color: var(--cinza-500);
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--cinza-200);
  }

  .campo-modal {
    margin-bottom: 14px;
  }
  .campo-modal label {
    display: block;
    font-size: 11px;
    font-weight: 700;
    color: var(--cinza-500);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .opcoes-tamanho {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .opcao-tamanho {
    padding: 8px 14px;
    border: 2px solid var(--cinza-200);
    background: white;
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: var(--primaria);
    transition: all 0.15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  .opcao-tamanho:hover { border-color: var(--acento); }
  .opcao-tamanho.selecionado {
    background: var(--acento);
    color: white;
    border-color: var(--acento);
  }
  .opcao-tamanho .preco {
    font-size: 11px;
    font-weight: 500;
    opacity: 0.85;
  }

  .opcoes-adicionais {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .opcao-adicional {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 12px;
    background: var(--cinza-100);
    border-radius: 6px;
    cursor: pointer;
    user-select: none;
  }
  .opcao-adicional:hover { background: var(--cinza-200); }
  .opcao-adicional input[type="checkbox"] { margin-right: 8px; }
  .opcao-adicional .nome-add { font-size: 13px; color: var(--primaria); font-weight: 500; }
  .opcao-adicional .preco-add { font-size: 12px; color: var(--verde); font-weight: 600; }

  .toggle-meia-meia {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px;
    background: var(--dourado-claro);
    border-radius: 8px;
    margin-bottom: 14px;
    cursor: pointer;
    user-select: none;
  }
  .toggle-meia-meia .info-mm {
    flex: 1;
    font-size: 13px;
    color: var(--dourado);
    font-weight: 600;
  }
  .toggle-meia-meia .info-mm small {
    display: block;
    font-weight: 400;
    font-size: 11px;
    color: var(--cinza-700);
    margin-top: 2px;
  }

  .quantidade-controle {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .quantidade-controle button {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--cinza-200);
    color: var(--primaria);
    border: none;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
  }
  .quantidade-controle button:hover { background: var(--cinza-300); }
  .quantidade-controle .valor-qty {
    min-width: 36px;
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    color: var(--primaria);
  }

  .rodape-modal {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-top: 20px;
    padding-top: 16px;
    border-top: 1px solid var(--cinza-200);
  }
  .preview-total {
    font-size: 13px;
    color: var(--cinza-500);
  }
  .preview-total b {
    color: var(--verde);
    font-size: 18px;
    font-weight: 800;
    margin-left: 6px;
  }
  .btn {
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    font-family: inherit;
  }
  .btn-primario { background: var(--acento); color: white; }
  .btn-primario:hover { background: var(--acento-escuro); }
  .btn-primario:disabled { background: var(--cinza-300); cursor: not-allowed; }
  .btn-cinza { background: var(--cinza-200); color: var(--cinza-700); }
  .btn-cinza:hover { background: var(--cinza-300); }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 12px 22px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    z-index: 300;
    animation: toastEntra 0.2s ease-out;
    color: white;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
  }
  .toast.sucesso { background: var(--verde); }
  .toast.erro { background: var(--acento); }
  .toast.info { background: var(--primaria); }
  @keyframes toastEntra {
    from { opacity: 0; transform: translate(-50%, -10px); }
    to { opacity: 1; transform: translate(-50%, 0); }
  }
</style>
</head>
<body>

<div id="statusConexao" class="status-conexao">conectando…</div>

<header>
  <h1>
    <span class="logo-mark">CG</span>
    Atendente
  </h1>
  <nav>
    <a href="/admin">Cardápio</a>
    <a href="/painel" target="_blank">Painel TV ↗</a>
  </nav>
</header>

<div class="layout">
  <div class="painel-cardapio">
    <h2>Cardápio <span id="badgeBusca"></span></h2>
    <div class="busca-wrap" id="buscaWrap">
      <span class="icone-busca">🔍</span>
      <input type="text" id="inputBusca" placeholder="Buscar item…" autocomplete="off">
      <button class="limpa-busca" title="Limpar" onclick="limparBusca()">×</button>
    </div>
    <div id="tabsCategorias" class="categorias-tabs"></div>
    <div id="gridItens" class="grid-itens"></div>
  </div>

  <div class="painel-carrinho">
    <h2>Pedido <span id="qtyCarrinho" class="qty">0</span></h2>
    <div id="listaCarrinho" class="lista-carrinho"></div>
    <textarea id="observacaoInput" placeholder="Observação (opcional): sem cebola, bem passada..."
      style="width: 100%; margin-top: 6px; padding: 8px 10px; border: 1px solid var(--cinza-300); border-radius: 6px; font-family: inherit; font-size: 12px; color: var(--primaria); resize: vertical; min-height: 42px; background: #fffbeb;"></textarea>
    <div class="total-carrinho">
      Total <span id="totalCarrinho" class="valor">R$ 0,00</span>
    </div>
    <button id="btnConfirmar" class="btn-confirmar">Confirmar pedido</button>
    <button id="btnLimpar" class="btn-limpar">limpar carrinho</button>
  </div>
</div>

<div class="secao-senhas">
  <h2>Senhas ativas</h2>
  <div class="grupo-senhas">
    <div>
      <h3>Prontas <span id="ctProntas">(0)</span></h3>
      <div id="cardsProntas" class="cards-senhas"></div>
    </div>
    <div>
      <h3>Em preparação <span id="ctPreparando">(0)</span></h3>
      <div id="cardsPreparando" class="cards-senhas"></div>
    </div>
  </div>
</div>

<!-- Modal Detalhe da Senha -->
<div id="modalSenha" class="modal-overlay" onclick="if(event.target===this) this.classList.remove('aberto')">
  <div class="modal">
    <h3 id="tituloSenha">Senha</h3>
    <div id="corpoSenha"></div>
    <div class="rodape-modal" style="justify-content: space-between;">
      <div style="display: flex; gap: 6px;">
        <button class="btn btn-cinza" onclick="reimprimirVia('cliente')">🖨 Cliente</button>
        <button class="btn btn-cinza" onclick="reimprimirVia('cozinha')">🖨 Cozinha</button>
      </div>
      <button class="btn btn-cinza" onclick="document.getElementById('modalSenha').classList.remove('aberto')">Fechar</button>
    </div>
  </div>
</div>

<!-- Modal Item -->
<div id="modalItem" class="modal-overlay">
  <div class="modal">
    <h3 id="modalItemNome">Item</h3>
    <div id="modalItemDesc" class="desc-item"></div>

    <div id="areaMeiaMeia"></div>

    <div class="campo-modal">
      <label>Tamanho</label>
      <div id="opcoesTamanho" class="opcoes-tamanho"></div>
    </div>

    <div id="campoSegundoSabor" class="campo-modal" style="display: none;">
      <label>Segundo sabor</label>
      <div id="opcoesSegundoSabor" class="opcoes-tamanho"></div>
    </div>

    <div id="campoAdicionais" class="campo-modal"></div>

    <div class="campo-modal">
      <label>Quantidade</label>
      <div class="quantidade-controle">
        <button type="button" onclick="mudarQty(-1)">−</button>
        <span id="qtyItem" class="valor-qty">1</span>
        <button type="button" onclick="mudarQty(+1)">+</button>
      </div>
    </div>

    <div class="rodape-modal">
      <div class="preview-total">
        <button class="btn btn-cinza" onclick="fecharModalItem()">Cancelar</button>
      </div>
      <div class="preview-total">
        Total <b id="previewTotal">R$ 0,00</b>
        <button id="btnAdicionar" class="btn btn-primario" style="margin-left: 12px;" onclick="adicionarAoCarrinho()">Adicionar</button>
      </div>
    </div>
  </div>
</div>

<script src="/atendente.js"></script>
</body>
</html>
